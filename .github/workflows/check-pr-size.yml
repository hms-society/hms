name: Check PR Size

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

jobs:
  check-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate PR additions
        id: calculate-additions
        run: |
          BASE_REF="${{ github.base_ref }}"
          TARGET_BRANCH="${BASE_REF:-${{ github.event.repository.default_branch }}}"

          # Garantir que a branch base está disponível para comparação
          git fetch origin "$TARGET_BRANCH"
          
          # Considera apenas arquivos TypeScript.
          ADDITIONS=$(git diff --numstat "origin/$TARGET_BRANCH...HEAD" \
            | awk -F '\t' '
                $3 ~ /\.(ts|tsx|mts|cts)$/ { add += $1 }
                END { print add }
              ')
          
          # Define 0 se o resultado for vazio
          ADDITIONS=${ADDITIONS:-0}
          
          echo "additions=$ADDITIONS" >> $GITHUB_OUTPUT
          echo "Total de linhas adicionadas em arquivos TypeScript: $ADDITIONS"
          
          if [ "$ADDITIONS" -gt 5000 ]; then
            echo "::error::Este Pull Request adiciona $ADDITIONS linhas TypeScript (excedendo o limite máximo de 5000 linhas)!"
            echo "Por favor, quebre este Pull Request em partes menores e focadas para facilitar a revisão de código."
            exit 1
          fi
