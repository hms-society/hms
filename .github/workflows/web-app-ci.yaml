name: Web App CI

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: web-app-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Web app checks
    runs-on: ubuntu-latest
    env:
      VITE_HMS_SERVER_APP_URL: http://localhost:3333
      VITE_SUPABASE_URL: http://localhost:8000
      VITE_SUPABASE_KEY: test-anon-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine relevant changes
        id: scope
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed_files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if printf '%s\n' "$changed_files" | grep -Eq '^apps/web/'; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            echo 'Web changes detected.'
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
            echo 'No web changes detected; this check is not applicable.'
          fi

      - name: Setup pnpm
        if: steps.scope.outputs.relevant == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Setup Node.js
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile

      - name: Code checks
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter web check:code

      - name: Type checks
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter web check:types

      - name: Test
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter web test

      - name: Install Playwright browser
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Route integration tests
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter web test:integration

      - name: Build
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter web build

      - name: Build Docker image
        if: steps.scope.outputs.relevant == 'true'
        run: docker build --file Dockerfile.web --tag hms-web:pr .
