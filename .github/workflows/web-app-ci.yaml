name: Web App CI

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: web-app-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Web app checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code checks
        run: pnpm --filter web check:code

      - name: Type checks
        run: pnpm --filter web check:types

      - name: Test
        run: pnpm --filter web test

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Route integration tests
        run: pnpm --filter web test:integration

      - name: Build
        run: pnpm --filter web build

      - name: Build Docker image
        run: docker build --file Dockerfile.web --tag hms-web:pr .
