name: Web App CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: web-app-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Web app checks
    runs-on: ubuntu-latest
    env:
      HMS_WEB_APP_PORT: '5000'
      VITE_HMS_SERVER_APP_URL: http://localhost:3333
      VITE_SUPABASE_URL: http://localhost:8000
      VITE_SUPABASE_KEY: test-anon-key
      # Os testes E2E de Formalização dependem do head final da cadeia empilhada.
      HMS_RUN_FORMALIZATION_E2E: ${{ github.event.pull_request.head.ref == 'codex/signing-gateway-s19-web-support-renames' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine relevant changes
        id: scope
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}"
          changed_files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if printf '%s\n' "$changed_files" | grep -Eq '^(apps/web/|\.github/workflows/web-app-ci\.yaml$|dependency-cruiser\.config\.mjs$|package\.json$|pnpm-lock\.yaml$|turbo\.json$|packages/core/|packages/validation/|scripts/write-coverage-report\.mjs$)'; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            echo 'Web changes detected.'
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
            echo 'No web changes detected; this check is not applicable.'
          fi

      - name: Setup pnpm
        if: steps.scope.outputs.relevant == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Setup Node.js
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate routes
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter web generate-routes

      - name: Architecture checks
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter web check:architecture

      - name: Lint checks
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter web check:lint

      - name: Type checks
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter web check:types

      - name: Run tests with coverage
        id: coverage
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter web test:coverage

      - name: Write Web coverage report
        if: always() && steps.scope.outputs.relevant == 'true' && hashFiles('apps/web/coverage/coverage-summary.json') != ''
        run: node scripts/write-coverage-report.mjs web apps/web/coverage/coverage-summary.json apps/web/coverage/coverage-comment.md
        env:
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}

      - name: Publish Web coverage on pull request
        if: always() && steps.scope.outputs.relevant == 'true' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('apps/web/coverage/coverage-comment.md') != ''
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs')
            const marker = '<!-- coverage-report:web -->'
            const body = fs.readFileSync('apps/web/coverage/coverage-comment.md', 'utf8')
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            )
            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            }
            if (existing) {
              await github.rest.issues.updateComment({ ...request, comment_id: existing.id })
            } else {
              await github.rest.issues.createComment({
                ...request,
                issue_number: context.issue.number,
              })
            }

      - name: Upload Web coverage artifact
        if: always() && steps.scope.outputs.relevant == 'true' && hashFiles('apps/web/coverage/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-${{ github.run_id }}
          path: apps/web/coverage/
          retention-days: 14

      - name: Install Playwright browser
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Route integration tests
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter web test:integration

      - name: Build
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter web build

      - name: Build Docker image
        if: steps.scope.outputs.relevant == 'true'
        run: docker build --file Dockerfile.web --tag hms-web:pr .
