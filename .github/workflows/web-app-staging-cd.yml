name: Web App Staging CD

on:
  push:
    branches:
      - feat/scrum-138-document-production-server-develop
  workflow_dispatch:

permissions: {}

concurrency:
  group: web-app-cd-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/feat/scrum-138-document-production-server-develop'
    name: Deploy web staging
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_HMS_WEB_APP_STG }}
        run: >-
          curl --fail-with-body --silent --show-error --request POST
          --header "Authorization: Bearer $COOLIFY_API_TOKEN" "$COOLIFY_WEBHOOK"
