name: Web App Production CD

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions: {}

concurrency:
  group: web-app-production-cd
  cancel-in-progress: false

jobs:
  deploy-production:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main') }}
    name: Deploy web production
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_WEB_PROD }}
        run: >-
          curl --fail-with-body --silent --show-error --request POST
          --header "Authorization: Bearer $COOLIFY_API_TOKEN" "$COOLIFY_WEBHOOK"
