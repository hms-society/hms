name: Core Package CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: core-package-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Core package checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine relevant changes
        id: scope
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed_files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if printf '%s\n' "$changed_files" | grep -Eq '^(packages/core/|packages/validation/|dependency-cruiser\.config\.mjs$|package\.json$|pnpm-lock\.yaml$|turbo\.json$)'; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            echo 'Core/Validation changes detected.'
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
            echo 'No Core/Validation changes detected; this check is not applicable.'
          fi

      - name: Setup pnpm
        if: steps.scope.outputs.relevant == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Setup Node.js
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile

      - name: Architecture checks
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter @hms/core --filter @hms/validation check:architecture

      - name: Lint
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter @hms/core --filter @hms/validation lint

      - name: Check types
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter @hms/core --filter @hms/validation check-types

      - name: Test
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter @hms/core test
