name: Core Package CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: core-package-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Core package checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine relevant changes
        id: scope
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}"
          changed_files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if printf '%s\n' "$changed_files" | grep -Eq '^(packages/core/|packages/validation/|\.github/workflows/core-package-ci\.yaml$|dependency-cruiser\.config\.mjs$|package\.json$|pnpm-lock\.yaml$|turbo\.json$|scripts/write-coverage-report\.mjs$)'; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            echo 'Core/Validation changes detected.'
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
            echo 'No Core/Validation changes detected; this check is not applicable.'
          fi
          echo "Scope comparison: origin/${{ github.base_ref }}...HEAD"

      - name: Setup pnpm
        if: steps.scope.outputs.relevant == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Setup Node.js
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile

      - name: Architecture checks
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter @hms/core --filter @hms/validation check:architecture

      - name: Lint
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter @hms/core lint

      - name: Check types
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter @hms/core check-types

      - name: Run tests with coverage
        id: coverage
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter @hms/core test:coverage

      - name: Write Core coverage report
        if: always() && steps.scope.outputs.relevant == 'true' && hashFiles('packages/core/coverage/coverage-summary.json') != ''
        run: node scripts/write-coverage-report.mjs core packages/core/coverage/coverage-summary.json packages/core/coverage/coverage-comment.md
        env:
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}

      - name: Publish Core coverage on pull request
        if: always() && steps.scope.outputs.relevant == 'true' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('packages/core/coverage/coverage-comment.md') != ''
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs')
            const marker = '<!-- coverage-report:core -->'
            const body = fs.readFileSync('packages/core/coverage/coverage-comment.md', 'utf8')
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            )
            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            }
            if (existing) {
              await github.rest.issues.updateComment({ ...request, comment_id: existing.id })
            } else {
              await github.rest.issues.createComment({
                ...request,
                issue_number: context.issue.number,
              })
            }

      - name: Upload Core coverage artifact
        if: always() && steps.scope.outputs.relevant == 'true' && hashFiles('packages/core/coverage/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage-${{ github.run_id }}
          path: packages/core/coverage/
          retention-days: 14
