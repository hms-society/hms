name: Server App CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: server-app-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Server app checks
    runs-on: ubuntu-latest
    env:
      PORT: '5555'
      HMS_SERVER_APP_PORT: '5555'
      HMS_SERVER_APP_MODE: dev
      HMS_WEB_APP_URL: http://localhost:5000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SUPABASE_URL: http://localhost:8000
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIn0.test-signature
      WHATSAPP_API_TOKEN: test-whatsapp-api-token
      WHATSAPP_PHONE_NUMBER_ID: test-phone-number-id
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: test-verify-token
      WHATSAPP_APP_SECRET: test-app-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine relevant changes
        id: scope
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed_files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if printf '%s\n' "$changed_files" | grep -Eq '^(\.github/workflows/server-app-ci\.yaml$|apps/server/|dependency-cruiser\.config\.mjs$|package\.json$|pnpm-lock\.yaml$|turbo\.json$|packages/core/|packages/validation/)'; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            echo 'Server changes detected.'
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
            echo 'No server changes detected; this check is not applicable.'
          fi

      - name: Setup pnpm
        if: steps.scope.outputs.relevant == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Setup Node.js
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile

      - name: Architecture checks
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter server check:architecture

      - name: Code checks
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter server check:code

      - name: Type checks
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter server check:types

      - name: Test
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter server test

      - name: Build
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm --filter server build

      - name: Build Docker image
        if: steps.scope.outputs.relevant == 'true'
        run: docker build --file Dockerfile.server --tag hms-server:pr .
