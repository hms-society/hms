name: Server App CI

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: server-app-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Server app checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code checks
        run: pnpm --filter server check:code

      - name: Type checks
        run: pnpm --filter server check:types

      - name: Test
        run: pnpm --filter server test

      - name: Build
        run: pnpm --filter server build

      - name: Build Docker image
        run: docker build --file Dockerfile.server --tag hms-server:pr .
