name: Server App CI

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: server-app-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Server app checks
    runs-on: ubuntu-latest
    env:
      PORT: '3333'
      HMS_SERVER_APP_PORT: '3333'
      HMS_SERVER_APP_MODE: dev
      HMS_WEB_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SUPABASE_URL: http://localhost:8000
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      WHATSAPP_API_TOKEN: test-whatsapp-api-token
      WHATSAPP_PHONE_NUMBER_ID: test-phone-number-id
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: test-verify-token
      WHATSAPP_APP_SECRET: test-app-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code checks
        run: pnpm --filter server check:code

      - name: Type checks
        run: pnpm --filter server check:types

      - name: Test
        run: pnpm --filter server test

      - name: Build
        run: pnpm --filter server build

      - name: Build Docker image
        run: docker build --file Dockerfile.server --tag hms-server:pr .
