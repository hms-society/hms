<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">HMS favicon</title>
  <desc id="desc">A compact HMS-inspired favicon using a teal serif H and orange dash.</desc>
  <rect width="64" height="64" rx="12" fill="#ffffff"/>

  <!-- Teal H mark, simplified from the HMS logo for small favicon sizes -->
  <g fill="#194B50">
    <!-- left stem and serifs -->
    <rect x="15" y="12" width="9" height="40" rx="1.2"/>
    <rect x="11" y="8" width="17" height="6" rx="1.8"/>
    <rect x="11" y="50" width="17" height="6" rx="1.8"/>

    <!-- right stem and serifs -->
    <rect x="40" y="12" width="9" height="40" rx="1.2"/>
    <rect x="36" y="8" width="17" height="6" rx="1.8"/>
    <rect x="36" y="50" width="17" height="6" rx="1.8"/>
  </g>

  <!-- Orange dash from the logo -->
  <rect x="25" y="29" width="14" height="6" rx="1" fill="#CB6421"/>
</svg>
